name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin sources and toolchain
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            toolchain/ysu-client/pnpm-lock.yaml

      - name: Install pinned toolchain dependencies
        working-directory: toolchain/ysu-client
        run: pnpm install --frozen-lockfile

      - name: Install plugin workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin tests
        run: pnpm test

      - name: Build plugin ZIPs
        run: pnpm build

      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: artifacts/*.zip
          if-no-files-found: error
